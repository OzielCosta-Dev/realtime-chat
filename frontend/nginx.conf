server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try the literal file, then a directory of that name, and only
        # fall back to index.html if NEITHER exists. That fallback is what
        # makes a hard refresh on /rooms/abc-123 work: nginx doesn't know
        # that's a React Router route, it just serves index.html anyway,
        # and React Router reads the URL client-side and renders the right
        # page. Without this line, that refresh would be a plain 404 from
        # nginx before React ever got a chance to run.
        try_files $uri $uri/ /index.html;
    }
}
